name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
    # Desktop-only changes do not affect the Docker image. GitHub skips path
    # filters for tag pushes, so releases still publish an image.
    paths-ignore: ['desktop/**', 'docs/**']
  # PRs only build the image to prove the Dockerfile still works; nothing is
  # pushed, so PR builds never touch the published tags.
  pull_request:
    branches: [main]
    paths-ignore: ['desktop/**', 'docs/**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Superseded PR builds are cancelled; runs on main / tags are never cancelled
# so a release always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only used when pushing (main / tags). Fork PRs get a read-only token
      # and never reach the login step.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

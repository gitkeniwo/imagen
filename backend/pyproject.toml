[project]
name = "nano-banana-studio-backend"
version = "0.2.1"
description = "Backend for Imagen (image-to-image studio over the Gemini API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "Pillow==11.1.0",
    "httpx==0.28.1",
    "google-genai>=1.0.0",
]

[tool.uv]
package = false

# Desktop packaging only. Never installed by the Docker image (`uv sync --no-dev`).
[dependency-groups]
desktop = ["pyinstaller>=6.22,<7"]

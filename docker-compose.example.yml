services:
  imagen:
    build: .
    image: nano-banana-studio
    container_name: nano-banana-studio
    ports:
      # Loopback only: the Docker build has no login, so anyone who can reach
      # the port can read and delete the whole library. See README › Docker.
      - "127.0.0.1:8000:8000"
    environment:
      IMAGEN_DATA_DIR: /data
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json
    volumes:
      # Persist app data (app.db + images/ + thumbs/) on the host.
      # Copy this file to docker-compose.yml and adjust the host path for your machine.
      - ./backend/data:/data
      # Read-only mount of host ADC credentials (generated by gcloud auth application-default login).
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcloud/adc.json:ro
    restart: unless-stopped

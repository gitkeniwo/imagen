[package]
name = "imagen"
version = "0.2.15"
description = "Imagen desktop shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
window-vibrancy = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Local copy of wry 0.57.0 with a drag-and-drop fix: upstream unwraps the
# pasteboard file list inside `draggingEntered:`, which aborts the app when a
# drag carries no readable list. Remove once upstream no longer unwraps.
# The patch only applies while tauri wants wry 0.57.x: after a tauri upgrade
# that needs a newer wry, Cargo uses crates.io and only warns "patch was not
# used". desktop/build.sh fails in that case; port the fix to the new
# version (vendor/wry/src/wkwebview/drag_drop.rs, `collect_paths`) or drop it.
[patch.crates-io]
wry = { path = "vendor/wry" }

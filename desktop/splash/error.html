<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Imagen - 启动失败</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f6f8fc; color: #1f2a3d; padding: 32px; box-sizing: border-box;
    }
    main { max-width: 640px; width: 100%; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fdecec; color: #b42318; border-radius: 999px;
      padding: 6px 14px; font-size: 12px; font-weight: 600;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d92d20; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { color: #4b5a73; font-size: 14px; line-height: 1.55; margin: 0 0 12px; }
    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px; background: #eef2f8; border: 1px solid #dde4ee;
      border-radius: 8px; padding: 10px 12px; color: #33415c;
      overflow-wrap: anywhere; user-select: text;
    }
    .row { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
    button {
      appearance: none; border: 0; border-radius: 9px;
      background: #205cb4; color: #fff; font-size: 14px; font-weight: 600;
      padding: 10px 18px; cursor: pointer;
    }
    button:hover { background: #1a4f9c; }
    button:disabled { background: #9db4d6; cursor: default; }
    #status { font-size: 13px; color: #4b5a73; }
    @media (prefers-color-scheme: dark) {
      body { background: #101827; color: #e6ecf6; }
      p, #status { color: #a9b8ce; }
      .log { background: #172133; border-color: #26344b; color: #c3d0e2; }
      .badge { background: #3a1d1d; color: #fda29b; }
    }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot"></span>后端未运行</span>
    <h1>Imagen 无法启动本地服务</h1>
    <p id="message">启动后端时发生错误。</p>
    <p>日志文件：</p>
    <div class="log" id="log">（未提供日志路径）</div>
    <div class="row">
      <button id="restart" type="button">重启后端</button>
      <span id="status"></span>
    </div>
  </main>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search);
      var msg = q.get("msg");
      var log = q.get("log");
      if (msg) document.getElementById("message").textContent = msg;
      if (log) document.getElementById("log").textContent = log;

      var button = document.getElementById("restart");
      var status = document.getElementById("status");
      var internals = window.__TAURI_INTERNALS__;
      if (!internals || typeof internals.invoke !== "function") {
        button.disabled = true;
        status.textContent = "当前页面没有 IPC 权限，无法自动重启。";
        return;
      }
      button.addEventListener("click", function () {
        button.disabled = true;
        status.textContent = "正在重启后端…";
        internals.invoke("restart_backend").then(function () {
          status.textContent = "已发出重启请求，等待健康检查…";
        }).catch(function (e) {
          status.textContent = "重启失败：" + String(e);
          button.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>

services:
  imagen:
    build: .
    image: nano-banana-studio
    container_name: nano-banana-studio
    ports:
      - "8000:8000"
    environment:
      IMAGEN_DATA_DIR: /data
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json
    volumes:
      # Persist real data (app.db + images/ + thumbs/)
      - ./backend/data:/data
      # Read-only mount of host ADC credentials (generated by gcloud auth application-default login)
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcloud/adc.json:ro
    restart: unless-stopped
